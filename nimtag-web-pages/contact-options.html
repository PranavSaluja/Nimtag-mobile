<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Options - NimTag</title>
    <!-- Optional: Feather Icons for sleek icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* General Styles for the Dark Theme */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            margin: 0;
            background-color: #1E2C3A;
            /* Dark blue background from NimTag Home Screen */
            color: #E0E0E0;
            /* Light text color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            line-height: 1.5;
            overflow-x: hidden;
            /* Prevent horizontal scroll */
        }

        .container {
            background-color: #2E3D49;
            /* Slightly lighter dark blue for cards */
            padding: 30px;
            border-radius: 20px;
            /* More rounded corners */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            /* Deeper shadow */
            max-width: 450px;
            /* Adjusted max width */
            width: 100%;
            text-align: center;
            /* Align text to center inside container */
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
            color: #E0E0E0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top Header */
        .header {
            text-align: left;
            /* Align text to left */
            margin-bottom: 25px;
            position: relative;
        }

        .back-arrow {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            width: 28px;
            /* Size of the back arrow */
            height: 28px;
            stroke: #E0E0E0;
            /* White arrow */
            stroke-width: 2;
        }

        .title {
            font-size: 1.8em;
            font-weight: bold;
            color: #E0E0E0;
            margin-bottom: 10px;
            margin-top: 35px;
            /* Space for the back arrow */
        }

        .description {
            font-size: 1em;
            color: #A0A0A0;
            /* Light grey */
            line-height: 1.4;
        }

        /* Profile Card */
        .profile-card {
            background-color: #3A4B5C;
            /* Even lighter dark blue */
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            margin-bottom: 30px;
            align-items: center;
            text-align: center;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #5C6E80;
            /* A contrasting background for avatar */
            margin-bottom: 15px;
            object-fit: cover;
            /* Ensure image covers the area */
        }

        .profile-name {
            font-size: 1.6em;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .profile-location {
            font-size: 1.1em;
            color: #A0A0A0;
            margin-bottom: 10px;
        }

        .profile-car-tag {
            font-size: 1em;
            color: #E0E0E0;
            line-height: 1.4;
        }

        /* Contact Options */
        .contact-options {
            margin-bottom: 30px;
        }

        .contact-option {
            display: flex;
            align-items: center;
            background-color: #3A4B5C;
            /* Darker blue for options */
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        .contact-option:last-child {
            margin-bottom: 0;
        }

        .contact-option:hover {
            background-color: #4C5E70;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
        }

        .contact-icon {
            margin-right: 15px;
            width: 28px;
            height: 28px;
            stroke: #FFD700;
            /* Gold tint for icons */
            fill: none;
            stroke-width: 2;
        }

        .contact-text {
            font-size: 1.1em;
            color: #E0E0E0;
            font-weight: 500;
        }

        /* eGold Message */
        .egold-message {
            font-size: 0.95em;
            color: #FFD700;
            /* Gold color */
            margin-top: 30px;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            .title {
                font-size: 1.6em;
                margin-top: 25px;
            }

            .profile-avatar {
                width: 70px;
                height: 70px;
            }

            .profile-name {
                font-size: 1.4em;
            }

            .contact-option {
                padding: 12px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <i data-feather="chevron-left" class="back-arrow" onclick="history.back()"></i>
            <h1 class="title">You're contacting a NimTag user</h1>
            <p class="description">This tag is protected for privacy. Your contact will be securely delivered.</p>
        </div>

        <div class="profile-card">
            <img src="https://i.imgur.com/K12X76L.png" alt="Arjun Avatar" class="profile-avatar">
            <!-- Replace with your actual image path -->
            <p class="profile-name" id="ownerNameDisplay">Arjun</p>
            <p class="profile-location">Delhi</p>
            <p class="profile-car-tag" id="vehicleInfoDisplay">Car Tag - White Swift DL 10 XX 1234</p>
        </div>

        <div class="contact-options">
            <div class="contact-option" onclick="handleMaskedCall()">
                <i data-feather="phone" class="contact-icon"></i>
                <span class="contact-text">Masked Call</span>
            </div>
            <div class="contact-option" onclick="handleWhatsApp()">
                <i data-feather="message-circle" class="contact-icon" style="stroke: #25D366;"></i>
                <!-- WhatsApp green tint -->
                <span class="contact-text">WhatsApp</span>
            </div>
            <div class="contact-option" onclick="handleLeaveMessage()">
                <i data-feather="mail" class="contact-icon"></i>
                <span class="contact-text">Leave a Message</span>
            </div>
        </div>

        <p class="egold-message">This user earns eGold every time their tag is scanned.</p>
    </div>

    <script>
        // Initialize Feather Icons
        feather.replace();

        // Function to get URL parameters
        function getQueryParams() {
            const params = {};
            const urlParams = new URLSearchParams(window.location.search);
            for (const [key, value] of urlParams) {
                params[key] = value;
            }
            return params;
        }

        let contactNumber = ''; // Store the contact number globally for this page

        document.addEventListener('DOMContentLoaded', () => {
            const params = getQueryParams();

            contactNumber = decodeURIComponent(params.contact || 'N/A');
            const reason = decodeURIComponent(params.reason || 'No reason selected'); // Not displayed, but can be used for logging

            // Populate Dummy Data (You'll integrate actual data here)
            // For the mockup, these are static. In a real system, you'd fetch user data based on the scanned tag/vNum
            // and display the actual name, location, and vehicle details.
            // document.getElementById('ownerNameDisplay').textContent = "Arjun";
            // document.getElementById('profileLocation').textContent = "Delhi";
            // document.getElementById('vehicleInfoDisplay').textContent = "Car Tag - White Swift DL 10 XX 1234";

            // If you passed vNum from QR:
            // const fullVehicleNumber = decodeURIComponent(params.vNum || 'N/A');
            // document.getElementById('vehicleInfoDisplay').textContent = `Car Tag - ${fullVehicleNumber}`;
            // If you passed vehicleDescription:
            // document.getElementById('vehicleInfoDisplay').textContent = decodeURIComponent(params.vehicleDescription || "Car Tag details");
        });

        // Event Handlers for Contact Options
        function handleMaskedCall() {
            if (contactNumber !== 'N/A') {
                // In a real app, this would trigger a masked call API.
                // For demonstration, we'll simulate.
                alert(`Initiating masked call to ${contactNumber}...\n(This would use a backend service)`);
                // For actual call, you might use window.location.href = `tel:${contactNumber}`;
                // but masked calls require server-side logic.
            } else {
                alert('Contact number not available.');
            }
        }

        function handleWhatsApp() {
            if (contactNumber !== 'N/A') {
                const message = encodeURIComponent("Hello, I'm contacting you about your NimTag. " +
                    "Reason: " + decodeURIComponent(getQueryParams().reason || ''));
                window.open(`https://wa.me/${contactNumber}?text=${message}`, '_blank');
            } else {
                alert('Contact number not available for WhatsApp.');
            }
        }

        function handleLeaveMessage() {
            alert(`Opening message interface.\n(This would lead to a message form or API call)`);
            // In a real app, this would open a modal/new page for composing a message.
        }
    </script>
</body>

</html>
